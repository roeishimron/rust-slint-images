# Builds both images and pushes them to ghcr.io/roeishimron/{android-base,rust-slint}.
# Tags come from docker-bake.hcl (ANDROID_API, RUST_VERSION): bump them there.
name: publish
on:
  push:
    branches: [main]
    paths: ['docker-bake.hcl', '*/Dockerfile', '.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the images are ~10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx bake --push
